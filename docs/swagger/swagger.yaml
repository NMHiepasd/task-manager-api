basePath: /
definitions:
  internal_transport_http_handler.AddProjectMemberRequest:
    properties:
      email:
        type: string
      role:
        enum:
        - editor
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  internal_transport_http_handler.CreateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  internal_transport_http_handler.CreateProjectRequest:
    properties:
      color:
        maxLength: 20
        type: string
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 150
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_transport_http_handler.CreateTagRequest:
    properties:
      color:
        maxLength: 20
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - name
    type: object
  internal_transport_http_handler.CreateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        maxLength: 5000
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - urgent
        type: string
      project_id:
        type: string
      status:
        enum:
        - todo
        - in_progress
        - completed
        - cancelled
        type: string
      tag_ids:
        items:
          type: string
        type: array
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - title
    type: object
  internal_transport_http_handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_transport_http_handler.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_transport_http_handler.ProblemDetails:
    properties:
      code:
        type: string
      detail:
        type: string
      instance:
        type: string
      invalid_params:
        items:
          $ref: '#/definitions/task-manager-api_internal_domain.InvalidParam'
        type: array
      request_id:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  internal_transport_http_handler.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_transport_http_handler.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  internal_transport_http_handler.SetTaskTagsRequest:
    properties:
      tag_ids:
        items:
          type: string
        type: array
    type: object
  internal_transport_http_handler.UpdateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  internal_transport_http_handler.UpdateProjectMemberRoleRequest:
    properties:
      role:
        enum:
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  internal_transport_http_handler.UpdateProjectRequest:
    properties:
      color:
        maxLength: 20
        type: string
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 150
        minLength: 1
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  internal_transport_http_handler.UpdateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        maxLength: 5000
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - urgent
        type: string
      project_id:
        type: string
      status:
        enum:
        - todo
        - in_progress
        - completed
        - cancelled
        type: string
      tag_ids:
        items:
          type: string
        type: array
      title:
        maxLength: 255
        minLength: 1
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  task-manager-api_internal_domain.InvalidParam:
    properties:
      name:
        type: string
      reason:
        type: string
    type: object
  task-manager-api_internal_service.AttachmentResponse:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      id:
        type: string
      task_id:
        type: string
      user_id:
        type: string
    type: object
  task-manager-api_internal_service.CommentResponse:
    properties:
      author:
        type: string
      content:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  task-manager-api_internal_service.CreateWebhookRequest:
    properties:
      events:
        items:
          type: string
        type: array
      project_id:
        type: string
      secret:
        type: string
      url:
        type: string
    type: object
  task-manager-api_internal_service.PaginatedCommentsResponse:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/task-manager-api_internal_service.CommentResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  task-manager-api_internal_service.PaginatedProjectsResponse:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/task-manager-api_internal_service.ProjectResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  task-manager-api_internal_service.PaginatedTasksResponse:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/task-manager-api_internal_service.TaskResponse'
        type: array
      limit:
        type: integer
      next_cursor:
        type: string
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  task-manager-api_internal_service.ProjectMemberResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      project_id:
        type: string
      role:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  task-manager-api_internal_service.ProjectResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      role:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  task-manager-api_internal_service.TagResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      user_id:
        type: string
    type: object
  task-manager-api_internal_service.TaskResponse:
    properties:
      assignee_id:
        type: string
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      id:
        type: string
      priority:
        type: string
      project_id:
        type: string
      status:
        type: string
      tags:
        items:
          $ref: '#/definitions/task-manager-api_internal_service.TagResponse'
        type: array
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  task-manager-api_internal_service.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: In seconds
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/task-manager-api_internal_service.UserResponse'
    type: object
  task-manager-api_internal_service.UpdateWebhookRequest:
    properties:
      events:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      url:
        type: string
    type: object
  task-manager-api_internal_service.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  task-manager-api_internal_service.WebhookDeliveryResponse:
    properties:
      delivered_at:
        type: string
      event_type:
        type: string
      execution_duration_ms:
        type: integer
      id:
        type: string
      payload:
        type: string
      response_body:
        type: string
      response_status:
        type: integer
      status:
        type: string
      webhook_id:
        type: string
    type: object
  task-manager-api_internal_service.WebhookResponse:
    properties:
      created_at:
        type: string
      events:
        items:
          type: string
        type: array
      id:
        type: string
      is_active:
        type: boolean
      project_id:
        type: string
      secret:
        description: Signing secret (returned only once upon creation; omitted in
          get/list/update)
        type: string
      updated_at:
        type: string
      url:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: API Support
    url: https://github.com/NMHiepasd/task-manager-api
  description: Production-ready RESTful Task Management API built with Go, Gin, PostgreSQL
    (pgx/v5 & sqlc), and Docker.
  license:
    name: MIT
  title: Task Manager REST API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Log in using email and password to receive JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.LoginRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      summary: Authenticate user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the given refresh token
      parameters:
      - description: Logout payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.LogoutRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      summary: Revoke session / Logout
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a newly issued token pair (with
        reuse detection)
      parameters:
      - description: Refresh token payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.RefreshTokenRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      summary: Rotate refresh token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account and obtain access and refresh JWT tokens
      parameters:
      - description: Registration payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.RegisterRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      summary: Register a new user
      tags:
      - auth
  /api/v1/projects:
    get:
      description: Retrieve paginated projects using keyset cursor or offset paging
      parameters:
      - description: Opaque keyset pagination cursor
        in: query
        name: cursor
        type: string
      - description: Offset page number (default 1)
        in: query
        name: page
        type: integer
      - description: Number of items per page (default 10, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.PaginatedProjectsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project owned by the authenticated user
      parameters:
      - description: Project payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.CreateProjectRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - projects
  /api/v1/projects/{id}:
    delete:
      description: Soft delete project owned by the authenticated user
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - projects
    get:
      description: Retrieve project details by its UUID (enforcing anti-IDOR 404)
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Get project by ID
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Update project details with optimistic concurrency control (version
        check)
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload with current version
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.UpdateProjectRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Update project details with optimistic concurrency control (version
        check)
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload with current version
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.UpdateProjectRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - projects
  /api/v1/projects/{id}/members:
    get:
      description: List all members of a project. Caller must be a project member.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task-manager-api_internal_service.ProjectMemberResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: List project members
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Add a collaborator to the project by email with role editor or
        viewer. Only project owner can perform this.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Member payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_handler.AddProjectMemberRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task-manager-api_internal_service.ProjectMemberResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Add project member
      tags:
      - projects
  /api/v1/projects/{id}/members/{userId}:
    delete:
      description: Remove a collaborator from the project (owner can remove members,
        members can remove themselves).
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: User UUID of collaborator
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_handler.ProblemDetails'
      security:
      - BearerAuth: []
      summary: Remove project member
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Update a collaborator's role in the project (editor or viewer).
        Only project owner can perform this.
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: User UUID of collaborator
        in: path
        name: userId
        required: true
        type: string
      - description: Role payload
        in: body
        name: payload
        required: true
        schema:
