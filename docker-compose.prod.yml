services:
  caddy:
    image: caddy:2-alpine
    container_name: task_manager_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - task_network_prod

  api:
    image: ${IMAGE_NAME:-ghcr.io/nmhiepasd/task-manager-api}:${IMAGE_TAG:-main}
    container_name: task_manager_api_prod
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_PORT: 8080
      APP_ENV: production
      GIN_MODE: release
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-task_manager}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RATE_LIMIT_AUTH_LIMIT: ${RATE_LIMIT_AUTH_LIMIT:-10}
      RATE_LIMIT_AUTH_WINDOW: ${RATE_LIMIT_AUTH_WINDOW:-1m}
      RATE_LIMIT_API_LIMIT: ${RATE_LIMIT_API_LIMIT:-100}
      RATE_LIMIT_API_WINDOW: ${RATE_LIMIT_API_WINDOW:-1m}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - task_network_prod

  db:
    image: postgres:16-alpine
    container_name: task_manager_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-task_manager}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-task_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - task_network_prod

  redis:
    image: redis:7-alpine
    container_name: task_manager_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - task_network_prod

volumes:
  caddy_data:
  caddy_config:
  pgdata_prod:
  redisdata_prod:

networks:
  task_network_prod:
    driver: bridge
