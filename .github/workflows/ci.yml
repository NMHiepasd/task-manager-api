name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m --verbose

  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install and Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./... | tee govulncheck-report.txt

      - name: Upload govulncheck Report
        uses: actions/upload-artifact@v4.6.1
        if: always()
        with:
          name: govulncheck-report
          path: govulncheck-report.txt
          retention-days: 14

  gitleaks:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Verify Migrations (Up -> Down -> Up)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/task_manager?sslmode=disable
        run: |
          chmod +x scripts/test-migrations.sh
          bash scripts/test-migrations.sh "$DATABASE_URL"

      - name: Run Unit Tests with Race Detector and Coverage
        run: |
          go test -v -race -short -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Verify Service Layer Coverage Threshold (>= 65%)
        run: |
          SERVICE_COV=$(go test -short -cover ./internal/service/... | awk '/coverage:/ {print $5}' | tr -d '%')
          echo "Service layer coverage: ${SERVICE_COV}% (minimum required: 65.0%)"
          awk -v cov="$SERVICE_COV" 'BEGIN { if (cov+0 < 65.0) { print "ERROR: Service layer coverage " cov "% is below threshold 65.0%"; exit 1 } else { print "SUCCESS: Service layer coverage meets threshold" } }'

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4.6.1
        if: always()
        with:
          name: code-coverage-reports
          path: |
            coverage.out
            coverage.html
          retention-days: 14

      - name: Run Integration Tests (Testcontainers)
        run: go test -v -tags=integration -timeout 180s ./...

      - name: Run Cursor Fuzz Test
        run: go test -fuzz=FuzzDecodeCursor -fuzztime=5s ./pkg/pagination/...

  delivery:
    name: Build & Package Docker Image
    runs-on: ubuntu-latest
    needs: [lint, security, gitleaks, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          load: true
          tags: local-image:test
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local-image:test
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Print Trivy Results
        if: always()
        run: |
          if [ -f trivy-results.txt ]; then
            cat trivy-results.txt
          fi

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4.6.1
        if: always()
        with:
          name: trivy-report
          path: trivy-results.txt
          retention-days: 14

      - name: Push Container Image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6.9.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
          cache-from: type=gha
