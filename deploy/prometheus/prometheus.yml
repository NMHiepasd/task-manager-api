global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "task-manager-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8080"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
