services:
  db:
    image: postgres:16-alpine
    container_name: task_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-task_manager}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/000001_create_initial_schema.up.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-task_manager}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - task_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 1.0.0
    container_name: task_manager_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: 8080
      APP_ENV: production
      GIN_MODE: release
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-32-bytes-minimum!!}
      DB_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-task_manager}?sslmode=disable
      DB_MAX_CONNS: 25
      DB_MIN_CONNS: 5
      DB_MAX_CONN_LIFETIME: 1h
      DB_MAX_CONN_IDLE_TIME: 30m
      DB_HEALTH_CHECK_PERIOD: 1m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task_network

  adminer:
    image: adminer:latest
    container_name: task_manager_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - task_network

volumes:
  pgdata:
    driver: local

networks:
  task_network:
    driver: bridge
